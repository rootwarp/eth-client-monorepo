# CC-2Jd self-devnet — four-container mesh.
#
#   devnet network (cc-devnet)
#     ├─ publisher   cc-p2p --publish-fixture  (cgc=128, all columns)
#     ├─ node-a      peer under test (default: mesh with everything)
#     ├─ node-b      second peer (real gossip mesh)
#     ├─ anchor      nginx serving genesis + CC-19 endpoints
#     └─ el          same image and cc-devnet-el snapshot as compose.beacon-core.yml
#
# Anchor, publisher, fixtures, and EL live in compose.mesh.yml so
# devnet/compose.beacon-core.yml (cc-p2p + cc-beacon-core) is the same mesh.
#
# Usage (from monorepo root): always use ./devnet/up.sh (sets genesis after build).
#
# SEC-H1: host port publishes bind 127.0.0.1 only (metrics/anchor). Libp2p is not
# published to the host — mesh stays on the docker network.
# EL host ports match docker-compose.yml (operator HTTP/metrics/devp2p).

name: cc-devnet

include:
  - compose.mesh.yml

x-cc-env: &cc-env
  RUST_LOG: ${RUST_LOG:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-cc-runtime: &cc-runtime
  restart: unless-stopped
  stop_signal: SIGTERM
  stop_grace_period: 5s
  networks: [ccdev]

x-p2p-build: &p2p-build
  context: ..
  dockerfile: Dockerfile
  args:
    SERVICE: cc-p2p
    CC_GIT_SHA: ${CC_GIT_SHA:-unknown}

services:
  node-a:
    <<: *cc-runtime
    build: *p2p-build
    command:
      - --devnet-peer
      - --node-key
      - /keys/node-a.key
      - --listen
      - /ip4/0.0.0.0/tcp/9000
      - --config-yaml
      - /fixture/config.yaml
      - --manifest
      - /fixture/manifest.json
      - --static-peers-file
      - /fixture/multiaddrs.node-a.txt
      - --metrics-addr
      - 0.0.0.0:9102
    environment:
      <<: *cc-env
      CC_P2P_DISABLE_DIAL: ${CC_NODE_A_DISABLE_DIAL:-false}
      CC_P2P_CLOCK__SLOTS_PER_EPOCH: ${CC_DEVNET_SLOTS_PER_EPOCH:-8}
      CC_P2P_CLOCK__MAXIMUM_GOSSIP_CLOCK_DISPARITY_MS: ${CC_DEVNET_GOSSIP_DISPARITY_MS:-125}
      CC_P2P_CLOCK__SECONDS_PER_SLOT: ${CC_DEVNET_SECONDS_PER_SLOT:-3}
    volumes:
      - ./out:/fixture:ro
      - ./out/node_keys:/keys:ro
    ports:
      - "127.0.0.1:19112:9102"
    depends_on:
      publisher:
        condition: service_started

  node-b:
    <<: *cc-runtime
    build: *p2p-build
    command:
      - --devnet-peer
      - --node-key
      - /keys/node-b.key
      - --listen
      - /ip4/0.0.0.0/tcp/9000
      - --config-yaml
      - /fixture/config.yaml
      - --manifest
      - /fixture/manifest.json
      - --static-peers-file
      - /fixture/multiaddrs.node-b.txt
      - --metrics-addr
      - 0.0.0.0:9102
    environment:
      <<: *cc-env
      CC_P2P_CLOCK__SLOTS_PER_EPOCH: ${CC_DEVNET_SLOTS_PER_EPOCH:-8}
      CC_P2P_CLOCK__MAXIMUM_GOSSIP_CLOCK_DISPARITY_MS: ${CC_DEVNET_GOSSIP_DISPARITY_MS:-125}
      CC_P2P_CLOCK__SECONDS_PER_SLOT: ${CC_DEVNET_SECONDS_PER_SLOT:-3}
    volumes:
      - ./out:/fixture:ro
      - ./out/node_keys:/keys:ro
    ports:
      - "127.0.0.1:19122:9102"
    depends_on:
      publisher:
        condition: service_started
