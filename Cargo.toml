[workspace]
resolver = "3"
members = [
  "crates/types",
  "crates/crypto",
  "crates/proto",
  "crates/bootstrap",
  "crates/config",
  "crates/state-transition",
  "crates/fork-choice",
  "crates/spec-tests",
  "crates/libp2p",
  "services/chain",
  "services/p2p",
  "services/attestation",
  "services/engine",
  "services/beacon-api",
  "services/storage",
  # bin/driver retired at CC-28 — member count 17 → 16; bin/ keeps devnet-gen.
  "bin/devnet-gen",
  # Phase 4 workspace admission (store DAG): 16 → 19.
  "crates/store",
  "bin/store-bench",
  "bin/serve-probe",
  # CC-4J offline store tool: 19 → 20.
  "bin/cc-store",
  # S0-A-13 work-scheduler substrate ([ARCH] §3.1): 20 → 21.
  "crates/scheduler",
  # S1-A-01 Engine API crate ([ARCH] §6.2 JWT re-point): 21 → 22.
  "crates/engine-api",
  # S1-A-07 typed handles ([ARCH] §2.1): 22 → 23.
  "crates/seam",
  # S2-A-01 chain-core extraction ([ARCH] §1.4): 23 → 24.
  "crates/chain-core",
  # S2-B-01 storage-core extraction ([ARCH] §1.4): 24 → 25.
  "crates/storage-core",
  # S2-J-01 bin/beacon-core composer ([ARCH] §4.2): 25 → 26.
  "bin/beacon-core",
  # S2-A-13 proto-free in-process boot harness ([ARCH] §8.2): 26 → 27.
  "crates/beacon-inproc",
  # S2-A-14: import → durable test crate. Proto-free tree (no tonic / cc-proto).
  "crates/beacon-import",
  # Shared secp256k1 node-key file. Not part of cc-crypto (verify path stays verify-only).
  "crates/node-key",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/dsrvlabs/eth-client-monorepo"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# llvm-cov / `make coverage` injects `--cfg coverage` for wall-clock test skips.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"

# Append-only: unforeseen dependencies are appended to the end of this table by the
# issue that needs them. Never re-sort existing entries so concurrent appends do not
# conflict on the same line (CC-1K / Architecture §13).
[workspace.dependencies]
# Internal crates
cc-types = { path = "crates/types" }
cc-crypto = { path = "crates/crypto" }
cc-proto = { path = "crates/proto" }
cc-bootstrap = { path = "crates/bootstrap" }
cc-config = { path = "crates/config" }
cc-state-transition = { path = "crates/state-transition" }
cc-fork-choice = { path = "crates/fork-choice" }
cc-spec-tests = { path = "crates/spec-tests" }

# External pins (Architecture §2.3 / §3.4 / §10, CC-02)
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-health = "0.14.6"
tonic-reflection = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.9.1"

# Config loader (Architecture §5 / ADR-12, CC-09a)
figment = { version = "0.10.19", features = ["env", "toml"] }
http = "1.5.0"
serde = { version = "1.0.219", features = ["derive"] }

# Service binaries (CC-01b)
anyhow = "1.0.100"

# Bootstrap telemetry (Architecture §4 / ADR-06, CC-05a)
prometheus-client = "0.25.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
hyper = { version = "1.11.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body = "1.1.0"
http-body-util = "0.1.4"
bytes = "1.12.1"
pin-project-lite = "0.2.17"
futures = "0.3.33"

# Consensus / SSZ / crypto pins (Architecture §13/1, CC-1K)
ethereum_ssz = { version = "0.10.4", features = ["context_deserialize"] }
ethereum_ssz_derive = "0.10.4"
ssz_types = "0.14.1"
tree_hash = "0.12.1"
tree_hash_derive = "0.12.1"
blst = "0.3.17"
c-kzg = "2.1.8"
rust_eth_kzg = "0.10.0"

# Open §13/1 pins resolved at workspace admission (CC-1K)
snap = "1.1.2"
arc-swap = "1.9.2"
lru = "0.18.2"
fixedbitset = "0.5.7"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde_yaml = "0.9.34"
ethereum_hashing = "0.8.0"
criterion = "0.8.2"
# CC-10b Hoodi fixture SHA-256 verify (test harness)
sha2 = "0.10.9"

# CC-10c preset / config / primitives (Architecture §2, §3.1)
typenum = "1.20.1"
thiserror = "2.0.17"

# CC-10d ExecutionPayload base_fee_per_gas (uint256); also used by ethereum_ssz / tree_hash
alloy-primitives = "1.6.1"
# CC-11a BLS batch verification CSPRNG (Architecture §4.1)
getrandom = "0.3.3"

# CC-11b CellKzg trusted_setup.json parsing (Architecture §4.3)
serde_json = "1.0.145"

# Phase 2 P2P workspace admission (CC-2K / Architecture §14/8)
cc-libp2p = { path = "crates/libp2p" }
# Git pin — crates.io facade (0.56) is stale vs protocol crates (CC-20/1).
# Rev recorded in docs/p2p-dependencies.md; only cc-libp2p may depend on libp2p*.
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "6348a0be4aeb5b48eecf17a5d0aae15ff8239984", features = [
  "identify",
  "yamux",
  "noise",
  "dns",
  "tcp",
  "tokio",
  "secp256k1",
  "macros",
  "metrics",
  "gossipsub",
  "quic",
  "ping",
  "request-response",
] }
discv5 = { version = "0.11.0", features = ["libp2p"] }
# §14/8 open pins resolved at first cargo add / existing lock (CC-2K); never invent patches.
proptest = "1.11.0"
arbitrary = "1.4.2"
smallvec = "1.15.2"
crossbeam-channel = "0.5.16"
# CC-2Ja devnet-gen CLI + TOML params
clap = { version = "4.5.53", features = ["derive", "env"] }
toml = "0.8.23"
hex = "0.4.3"

# Phase 3 Engine API transport (CC-30a / Architecture §12/1) — append-only.
# Design's four pins: HTTP client (reqwest, already above), JSON-RPC hand-rolled
# over serde_json (already above), HS256 signer, offline test double + crc32 log.
jsonwebtoken = "9.3.1"
wiremock = "0.6.5"
crc32fast = "1.5.0"
# proptest already pinned at CC-2K; hex already pinned (JWT secret decode).

# Phase 4 store DAG workspace admission — append-only path pin (engine line later).
cc-store = { path = "crates/store" }
# CC-40b engine seam (Architecture §1.1 / §8); V-4: crates.io max 4.x minor as of adoption.
redb = "4.1.0"

# CC-41 split lock (read_recursive) — Architecture §3.1
parking_lot = "0.12.5"

# S0-A-13 work-scheduler substrate ([ARCH] §3.1). Leaf: no workspace edges.
cc-scheduler = { path = "crates/scheduler" }

# S1-A-01 Engine API crate ([ARCH] §6.2). Skeleton: no workspace edges.
cc-engine-api = { path = "crates/engine-api" }
# S1-A-07 typed handles ([ARCH] §2.1). S1-A-09 Ipc adds the cc-proto edge.
cc-seam = { path = "crates/seam" }
# Object-safe async traits for `Arc<dyn ChainIngress>` / `Arc<dyn P2pEgress>`.
async-trait = "0.1.91"
# S2-A-01 / S2-A-03 consensus core ([ARCH] §1.4). Library; cc-chain is the thin host.
cc-chain-core = { path = "crates/chain-core" }
# S2-B-01: storage-core extraction ([ARCH] §1.4). Writer + serve read paths.
cc-storage-core = { path = "crates/storage-core" }
# S2-J-01: thin composer ([ARCH] §4.2). Opens redb before any subsystem.
cc-beacon-core = { path = "bin/beacon-core" }
# S2-A-13: proto-free in-process boot harness ([ARCH] §8.2). No tonic / cc-proto.
cc-beacon-inproc = { path = "crates/beacon-inproc" }
# S2-A-14: import → durable assertion crate. Default-features off on grpc crates.
cc-beacon-import = { path = "crates/beacon-import" }
# S2-J-01: checkpoint_sync stays on cc-chain (HTTP grandfather).
cc-chain = { path = "services/chain" }
# Shared secp256k1 node-key file. Pin 0.14 (already resolved for libp2p-identity);
# do not bump unrelated crates.
k256 = "0.14"
cc-node-key = { path = "crates/node-key" }

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 16
panic = "unwind"
overflow-checks = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.bench]
inherits = "release"
debug = 2
