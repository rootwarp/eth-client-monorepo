[package]
name = "cc-p2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "cc_p2p"
path = "src/lib.rs"

[[bin]]
name = "cc-p2p"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
cc-bootstrap = { workspace = true }
cc-config = { workspace = true }
cc-crypto = { workspace = true, features = ["signing"] }
cc-libp2p = { workspace = true }
cc-proto = { workspace = true }
cc-seam = { workspace = true }
cc-types = { workspace = true }
# Shared node-key file. Appended; not re-sorted.
cc-node-key = { workspace = true }
alloy-primitives = { workspace = true }
# Workspace pin from CC-2K; first consumer (CC-21a probe / EnrManager skeleton).
discv5 = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
prometheus-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { workspace = true }
tonic-health = { workspace = true }
# CC-2Jd publisher CLI + fixture / key derivation
clap = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
# CC-22d: validators, seen/pending, inclusion-proof LRU
lru = { workspace = true }
ethereum_ssz = { workspace = true }
ssz_types = { workspace = true }
tree_hash = { workspace = true }
# CC-23a: req/resp SSZ+snappy framing
snap = { workspace = true }
# CC-26a: backfill cache SmallVec block rows
smallvec = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
prometheus-client = { workspace = true }
futures = { workspace = true }
# CC-4G /1 custody subset: Fulu networking get_custody_groups vectors.
cc-spec-tests = { workspace = true }
serde_yaml = { workspace = true }
serde = { workspace = true }
