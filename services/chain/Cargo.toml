[package]
name = "cc-chain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "cc_chain"
path = "src/lib.rs"

[[bin]]
name = "cc-chain"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
cc-bootstrap = { workspace = true }
# S2-A-01 / S2-A-02 / S2-A-03: library lives in cc-chain-core (append-only).
cc-chain-core = { workspace = true }
cc-config = { workspace = true }
cc-crypto = { workspace = true }
cc-engine-api = { workspace = true }
cc-fork-choice = { workspace = true }
cc-proto = { workspace = true }
cc-scheduler = { workspace = true }
cc-seam = { workspace = true }
cc-state-transition = { workspace = true }
cc-types = { workspace = true }
ethereum_ssz = { workspace = true }
ethereum_ssz_derive = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
prometheus-client = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# CC-38a: kzg_commitment_to_versioned_hash for block-branch trigger (no engine dep).
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { workspace = true }
tracing = { workspace = true }
tree_hash = { workspace = true }

[dev-dependencies]
cc-crypto = { workspace = true, features = ["signing"] }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
prost = { workspace = true }
ssz_types = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
toml = { workspace = true }
tonic-health = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
