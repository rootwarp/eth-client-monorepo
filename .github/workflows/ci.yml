# CC-07a — core CI gates: fmt, clippy, test (+ caching).
# CC-08 — deps job (cargo deny + crate DAG); required once this lands (Architecture §9).
# CC-10h — suite split (§10.4): test = unit + minimal; vectors = mainnet + general,
#          sharded and merge-blocking. Hoodi fixture cache installed (CC-10b block).
# Toolchain pin lives only in rust-toolchain.toml (CC-07/2); never duplicate the version here.
#
# Local reproduction of the suite split (after fetch scripts; same filters as CI):
#
#   bash scripts/fetch-spec-vectors.sh
#   bash scripts/fetch-hoodi-fixtures.sh
#   export HOODI_FIXTURES_CACHE="${HOODI_FIXTURES_CACHE:-$HOME/.cache/cc-hoodi-fixtures}"
#
#   # test job — unit tests + all minimal-preset suites (CC-07/4 ≤10 min intent)
#   cargo nextest run --workspace --locked --profile ci \
#     -E 'not binary(ssz_generic) & not binary(custody) & not (binary(ssz_static) & test(mainnet::))'
#
#   # vectors job — mainnet + general (ssz_generic, KZG both backends), shard i of 4
#   cargo nextest run --workspace --locked --profile ci \
#     --features cc-crypto/kzg-c-kzg,cc-crypto/kzg-rust-eth-kzg \
#     -E 'binary(ssz_generic) + binary(custody) + binary(kzg) + (binary(ssz_static) & test(mainnet::))' \
#     --partition count:i/4
#
name: CI

on:
  pull_request:
    # labeled/unlabeled: re-run when the `buf skip breaking` escape hatch is applied/removed (CC-03).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    # develop is this monorepo's integration branch (intentional deviation from Architecture §9 main-only).
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Reads rust-toolchain.toml (channel + rustfmt/clippy components).
      # cache: false — avoid double-invoking Swatinem/rust-cache (setup-rust-toolchain defaults cache: true).
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo clippy
        # --locked: R-5 (Cargo.lock is source of truth for binary workspaces).
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # D-3: DAG guard lives in clippy (required) so it blocks merges before deps (CC-08) is required.
      - name: check crate DAG
        run: bash scripts/check-crate-dag.sh

      # CC-09/3: no ad-hoc std::env::var outside crates/config (blocking; D-3 precedent).
      - name: check no env reads outside crates/config
        run: bash scripts/check-no-env-reads.sh

      # One non-test commit_anchor( call, and it lives in the beacon-core composer.
      - name: check one commit_anchor call site
        run: bash scripts/check-one-commit-anchor.sh

      # Tests must not name the writer seed door (submit_p0_committed, blocking_submit_p0_committed, StagedBlock).
      - name: check no writer seed door in tests
        run: bash scripts/check-no-seed-door.sh

      # CC-28/2: no HTTP client on the block-import path; p2p tree has no reqwest.
      - name: check no HTTP on import path
        run: bash scripts/check-no-http-import-path.sh

      # S2-A-13/A-14: in-process boot + import crates cargo tree has no tonic / cc-proto.
      - name: check in-process harness has no gRPC
        run: bash scripts/check-no-grpc-beacon-inproc.sh

      # S0a-B-06: Actions must be SHA-pinned (docs/supply-chain.md exact-pin policy).
      - name: check GitHub Actions SHA pins
        run: bash scripts/check-gha-sha-pins.sh

      # S0a-B-04: Makefile CI_JOBS must match this file's job ids.
      - name: check CI job list mirrors Makefile
        run: bash scripts/check-ci-job-list.sh

      # S0-B-02 / P0-07 + P1-A/27: three URI overrides + storage identity mount.
      # A Hoodi block-import smoke is outside this job's budget; this is the
      # static check that would have caught the missing keys.
      - name: check compose URI overrides and identity mount
        run: bash scripts/check-compose-uri-overrides.sh

      # S0-A-12 / P1-B/8: one fork-schedule walk outside cc-types.
      - name: check fork-schedule walks
        run: bash scripts/check-fork-schedule-walks.sh

      # S0-B-20: compose host-publish policy only (no docker pull).
      # E0.8 / M4 is `--live` on the compose job against a running stack.
      - name: check compose host-publish policy
        run: bash scripts/offhost-port-scan.sh --policy

      # S1-B-06: extract ADR[ -]<id> + Architecture §<n>; fail unknown ADR ids
      # (reconciliation.md id column or docs/adr/ADR-*.md). Architecture § is census-only.
      - name: check ADR citation resolver
        run: bash scripts/check-adr-resolver.sh

  # CC-10h — unit tests + all minimal-preset suites; keep inside Phase 0's 10-minute
  # CC-07/4 budget. Mainnet + general suites move to the sharded `vectors` job.
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      HOODI_FIXTURES_CACHE: /home/runner/.cache/cc-hoodi-fixtures
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-nextest

      # E1.3 / S1-A-12: both InProcess and Ipc must pass the cc-seam suite.
      - name: cargo test -p cc-seam (both impls)
        run: cargo test -p cc-seam --locked

      # Spec-vector tarball cache (Phase 0 shape) — minimal ssz_static needs the tree.
      - name: Resolve spec-vector cache path
        id: vectors
        run: |
          CACHE_ROOT="${SPEC_VECTORS_CACHE:-${HOME}/.cache/eth-consensus-spec-vectors}"
          TAG="$(awk -F'=' '
            $0 ~ /^[[:space:]]*tag[[:space:]]*=/ {
              v = $0
              sub(/^[^=]*=[[:space:]]*/, "", v)
              gsub(/^[[:space:]]*"?|"?[[:space:]]*$/, "", v)
              print v
              exit
            }
          ' spec-vectors.lock)"
          if [[ -z "${TAG}" ]]; then
            echo "error: failed to parse tag from spec-vectors.lock" >&2
            exit 1
          fi
          # Same allowlist as scripts/record-vector-layout.sh (F1): start with
          # alnum; only [A-Za-z0-9._-] thereafter; reject ".." path traversal.
          if [[ ! "${TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "error: tag contains disallowed characters (want ^[A-Za-z0-9][A-Za-z0-9._-]*\$): ${TAG}" >&2
            exit 1
          fi
          if [[ "${TAG}" == *..* ]]; then
            echo "error: tag must not contain '..': ${TAG}" >&2
            exit 1
          fi
          echo "dl_dir=${CACHE_ROOT}/${TAG}/_dl" >> "${GITHUB_OUTPUT}"
          echo "cache_root=${CACHE_ROOT}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      # R-3 / §7.5: cache _dl/ tarballs only — never the unpacked tree (tests/, markers).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.vectors.outputs.dl_dir }}
          key: ${{ hashFiles('spec-vectors.lock') }}

      - name: Fetch and verify spec vectors
        env:
          SPEC_VECTORS_CACHE: ${{ steps.vectors.outputs.cache_root }}
        run: bash scripts/fetch-spec-vectors.sh

      # CC-10b Hoodi fixture cache — defined in
      # crates/types/tests/fixtures/README.md; installed by CC-10h.
      - name: Hoodi fixtures cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.HOODI_FIXTURES_CACHE }}
          key: hoodi-fixtures-3649472-a87477f2d26512114cea60cab285733b61b1a5aab1a12df3dc73105b510b4a96
          restore-keys: |
            hoodi-fixtures-3649472-

      - name: Ensure Hoodi fixtures (miss → fetch)
        env:
          HOODI_FIXTURES_CACHE: ${{ env.HOODI_FIXTURES_CACHE }}
        run: bash scripts/fetch-hoodi-fixtures.sh

      - name: cargo nextest (unit + minimal)
        # Exclude mainnet/general suites owned by `vectors`. Keep unit tests
        # (incl. kzg with default backend) and ssz_static::minimal::*.
        run: |
          cargo nextest run --workspace --locked --profile ci \
            -E 'not binary(ssz_generic) & not binary(custody) & not (binary(ssz_static) & test(mainnet::))'

  # CC-03 — buf governance (Architecture §3.3, §9): lint + format + FILE-category
  # breaking via the unified bufbuild/buf-action@v1 (not the deprecated trio), and
  # the CC-02/4 re-modelling grep as a blocking step. Required once CC-07b lands.
  proto:
    name: proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # CC-03/3: local history for push-path ref=HEAD~1 breaking baseline.
          fetch-depth: 2

      # S0a-B-05: branch comes from the push target / PR base, not a hardcoded
      # `develop`. Fixtures under .github/fixtures/proto-breaking/ dry-run this.
      - name: Check proto breaking baseline fixtures
        run: bash scripts/proto-breaking-against.sh --self-test

      - name: Resolve proto breaking baseline
        id: against
        run: |
          set -euo pipefail
          url="$(bash scripts/proto-breaking-against.sh)"
          echo "breaking_against=${url}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${url}" != *"#branch=${GITHUB_REF_NAME},"* ]]; then
            echo "error: push baseline must use branch=${GITHUB_REF_NAME}: ${url}" >&2
            exit 1
          fi
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          input: proto
          lint: true
          format: true
          # Push: always break-check. PR: skip when the `buf skip breaking` label is present
          # (do not force `breaking: true` — that defeats the label hatch).
          breaking: ${{ github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'buf skip breaking') }}
          # No BSR in Phase 0 — never push named modules.
          push: false
          # Workflow permissions are contents: read only.
          pr_comment: false
          # Push: parent of this push on the push-target branch (main or develop).
          # PR: tip of the PR base branch, same subdir.
          breaking_against: ${{ steps.against.outputs.url }}

      # CC-02/4 — consensus containers must not reappear as proto messages.
      - name: check no consensus re-modelling
        run: bash scripts/check-no-remodelling.sh

  # CC-10h — mainnet-preset suites + general (ssz_generic, KZG cell under both
  # backends). Merge-blocking once branch protection requires every matrix check
  # (Phase 0 §7.5 / Architecture §10.4). Own ~20-minute budget (not CC-07/4).
  #
  # R-8: partition count = number of M1.1 vector test binaries — four
  # (ssz_static, ssz_generic, kzg, custody) — NOT Architecture §10.4's
  # illustrative count:N/4. nextest's default for a shard matching zero tests is
  # fail; a newly required job that is red on the commit that requires it invites
  # un-requiring it. Raise the count once M1.2's suites land, and again if one
  # shard's wall time dominates. Do not add a placeholder test to fill a shard.
  #
  # Branch-protection check names (matrix): `vectors (1/4)`, `vectors (2/4)`,
  # `vectors (3/4)`, `vectors (4/4)`. A human must add all four to required
  # status checks on `develop` (and later `main`); this workflow cannot edit
  # branch protection.
  vectors:
    name: vectors (${{ matrix.partition }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # R-8: four = M1.1 binaries ssz_static, ssz_generic, kzg, custody.
        partition: [1, 2, 3, 4]
    env:
      HOODI_FIXTURES_CACHE: /home/runner/.cache/cc-hoodi-fixtures
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-nextest

      # Resolve <cache>/<tag>/_dl so the cache path stays pin-accurate without
      # hardcoding the tag (key changes only when the lockfile changes).
      - name: Resolve spec-vector cache path
        id: vectors
        run: |
          CACHE_ROOT="${SPEC_VECTORS_CACHE:-${HOME}/.cache/eth-consensus-spec-vectors}"
          TAG="$(awk -F'=' '
            $0 ~ /^[[:space:]]*tag[[:space:]]*=/ {
              v = $0
              sub(/^[^=]*=[[:space:]]*/, "", v)
              gsub(/^[[:space:]]*"?|"?[[:space:]]*$/, "", v)
              print v
              exit
            }
          ' spec-vectors.lock)"
          if [[ -z "${TAG}" ]]; then
            echo "error: failed to parse tag from spec-vectors.lock" >&2
            exit 1
          fi
          # Same allowlist as scripts/record-vector-layout.sh (F1): start with
          # alnum; only [A-Za-z0-9._-] thereafter; reject ".." path traversal.
          if [[ ! "${TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "error: tag contains disallowed characters (want ^[A-Za-z0-9][A-Za-z0-9._-]*\$): ${TAG}" >&2
            exit 1
          fi
          if [[ "${TAG}" == *..* ]]; then
            echo "error: tag must not contain '..': ${TAG}" >&2
            exit 1
          fi
          echo "dl_dir=${CACHE_ROOT}/${TAG}/_dl" >> "${GITHUB_OUTPUT}"
          echo "cache_root=${CACHE_ROOT}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      # R-3 / §7.5: cache _dl/ tarballs only — never the unpacked tree (tests/, markers).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.vectors.outputs.dl_dir }}
          key: ${{ hashFiles('spec-vectors.lock') }}

      - name: Fetch and verify spec vectors
        env:
          SPEC_VECTORS_CACHE: ${{ steps.vectors.outputs.cache_root }}
        run: bash scripts/fetch-spec-vectors.sh

      # CC-10b Hoodi fixture cache — defined in
      # crates/types/tests/fixtures/README.md; installed by CC-10h.
      - name: Hoodi fixtures cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.HOODI_FIXTURES_CACHE }}
          key: hoodi-fixtures-3649472-a87477f2d26512114cea60cab285733b61b1a5aab1a12df3dc73105b510b4a96
          restore-keys: |
            hoodi-fixtures-3649472-

      - name: Ensure Hoodi fixtures (miss → fetch)
        env:
          HOODI_FIXTURES_CACHE: ${{ env.HOODI_FIXTURES_CACHE }}
        run: bash scripts/fetch-hoodi-fixtures.sh

      - name: cargo nextest (mainnet + general, shard)
        # Both KZG features (CC-11/1): cell suite exercises c-kzg and rust-eth-kzg.
        # Filter = M1.1 vector binaries; partition count matches that set (R-8).
        run: |
          cargo nextest run --workspace --locked --profile ci \
            --features cc-crypto/kzg-c-kzg,cc-crypto/kzg-rust-eth-kzg \
            -E 'binary(ssz_generic) + binary(custody) + binary(kzg) + (binary(ssz_static) & test(mainnet::))' \
            --partition count:${{ matrix.partition }}/4

  # CC-08 — supply-chain gate (Architecture §9, R-5). Required for merge once
  # branch protection includes `deps` (fmt/clippy/test/proto/deps).
  # check-crate-dag.sh also runs in clippy (D-3); duplicate is intentional.
  deps:
    name: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny check advisories bans licenses sources

      - name: check crate DAG
        run: bash scripts/check-crate-dag.sh

      # CC-21b — Blob-Schedule guard one layer up: no MAX_BLOBS_PER_BLOCK /
      # ELECTRA_FORK_EPOCH hard-codes in services/p2p or crates/libp2p.
      - name: check no MAX_BLOBS_PER_BLOCK / ELECTRA_FORK_EPOCH in p2p surface
        run: bash scripts/check-no-max-blobs-p2p.sh

      # CC-20/1 / CC-2K: defense-in-depth grep for libp2p* declarations outside the
      # allowed surfaces. Primary enforcement is scripts/check-crate-dag.sh (metadata
      # declaration rule + pin-source integrity + docs/constant rev match). This step
      # still fails string form (`libp2p = "0.56"`) and table form (`libp2p = { version = "…" }`,
      # `libp2p = { git = … }`, `[dependencies.libp2p]`) outside crates/libp2p/ and root.
      - name: no libp2p dependency keys outside crates/libp2p (and root pin)
        run: |
          set -euo pipefail
          # Any libp2p* assignment or [dependencies.libp2p*] table key.
          # Exclude: crates/libp2p (sole allowed consumer) and root Cargo.toml (workspace pin).
          offenders="$(
            grep -rnE --include='Cargo.toml' \
              '^[[:space:]]*libp2p[a-zA-Z0-9_-]*[[:space:]]*=|^[[:space:]]*\[dependencies\.libp2p[a-zA-Z0-9_-]*\]' . \
              | grep -vE '^./crates/libp2p/|^./Cargo.toml:' \
              || true
          )"
          if [[ -n "${offenders}" ]]; then
            echo "error: libp2p* dependency declaration outside crates/libp2p/ (and root pin):" >&2
            echo "${offenders}" >&2
            echo "note: primary gate is scripts/check-crate-dag.sh (pin source + declaration rule)" >&2
            exit 1
          fi
          echo "ok: no libp2p* dependency keys outside crates/libp2p/ (and root pin)"

  # CC-04b — mutual-health compose proof (Architecture §6.5, §9, §12.6).
  # Non-required: deliberately outside CC-07/4's ten-minute budget (cold release
  # build of six binaries exceeds it). Purpose is to stop the headline Phase 0
  # proof from rotting between manual runs — not to gate merges.
  # Path-scoped: always on push to main/develop; on PRs only when image, compose,
  # bootstrap, or the health scripts change.
  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history so the PR path filter can diff against the base SHA.
          fetch-depth: 0

      - name: Path filter
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # PR: only when Dockerfile / compose / bootstrap / health scripts change (§9).
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          if git diff --name-only "${base}" "${head}" | grep -qE \
            '^(Dockerfile|docker-compose\.yml|crates/bootstrap/|scripts/(wait-healthy|prove-mutual-health|check-compose-uri-overrides|offhost-port-scan)\.sh)'; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping compose proof — no in-scope paths changed on this PR."
          fi

      # gRPC 9001–9006 is unpublished (P0-01). prove-mutual-health.sh probes
      # via `docker compose exec` + the image's /usr/local/bin/grpc-health-probe;
      # wait-healthy.sh reads compose Health. No host-side probe install.
      - name: Compose build, wait-healthy, prove-mutual-health
        if: steps.paths.outputs.run == 'true'
        env:
          CC_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker compose build
          docker compose up -d
          bash scripts/wait-healthy.sh
          bash scripts/check-compose-uri-overrides.sh --runtime
          bash scripts/prove-mutual-health.sh
          bash scripts/offhost-port-scan.sh --live
