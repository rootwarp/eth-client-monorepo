syntax = "proto3";
package eth.storage.v1;

import "eth/common/v1/common.proto";

// Persistence: BeaconState / block / blob-column history and cold queries.
//
// Phase 0: GetInfo.
// Phase 4 (CC-4F): p2p ↔ storage ninth contract — four downward serve reads
//   (SSZ bytes only), PutBackfillBatch upward (one transaction), WatchServeWindow
//   as a server stream, plus CC-4I historical stubs declared here and implemented
//   later. Additive methods only; buf breaking engaged and passes with no label
//   (Deviations 5).
//
// Consensus bodies cross as `bytes ssz` only — never re-modelled as proto
// messages (Architecture §2.2 invariant 2). Stored bytes ARE the wire bytes.
service StorageService {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);

  // Downward — serve reads. SSZ bytes only: storage never re-serializes and
  // p2p never re-parses (CC-43/5 round-trip property).
  rpc GetBlocksByRange(GetBlocksByRangeRequest) returns (GetBlocksResponse);
  rpc GetBlocksByRoot(GetBlocksByRootRequest) returns (GetBlocksResponse);
  rpc GetColumnsByRange(GetColumnsByRangeRequest) returns (GetColumnsResponse);
  rpc GetColumnsByRoot(GetColumnsByRootRequest) returns (GetColumnsResponse);

  // Upward — below-anchor backfill write path (CC-47). One store transaction.
  rpc PutBackfillBatch(PutBackfillBatchRequest) returns (PutBackfillBatchResponse);

  // Window record. ONLY source p2p's AtomicU64 is written from (CC-48/4).
  // Stream, not poll — value changes on backfill / prune / cgc (CC-4F/4).
  rpc WatchServeWindow(WatchServeWindowRequest) returns (stream ServeWindow);

  // CC-4I — Phase 6 read surface. Declared here; implemented by CC-4I.
  rpc GetHistoricalBlock(GetHistoricalBlockRequest) returns (GetHistoricalBlockResponse);
  rpc GetSnapshotState(GetSnapshotStateRequest) returns (stream StateChunk);
  // Additive within eth.storage.v1 (CC-4I): finalized-checkpoint history.
  rpc GetFinalizedCheckpointHistory(GetFinalizedCheckpointHistoryRequest) returns (GetFinalizedCheckpointHistoryResponse);
}

message GetInfoRequest {}

message GetInfoResponse {
  eth.common.v1.BuildInfo build_info = 1;
}

// ---------------------------------------------------------------------------
// Downward serve reads (CC-4F)
// ---------------------------------------------------------------------------

// BeaconBlocksByRange-shaped: `count` slots from `start_slot` (ascending).
// Cap: MAX_REQUEST_BLOCKS_DENEB = 128. Over → INVALID_ARGUMENT.
message GetBlocksByRangeRequest {
  uint64 start_slot = 1;
  uint64 count = 2;
}

// BeaconBlocksByRoot-shaped. Cap 128 roots. Over → INVALID_ARGUMENT.
message GetBlocksByRootRequest {
  repeated bytes roots = 1; // each 32 B
}

// One block SSZ body. Metadata is identity only — body is opaque wire bytes.
message BlockSsz {
  bytes ssz = 1;
  uint64 slot = 2;
  bytes root = 3; // 32 B
}

message GetBlocksResponse {
  repeated BlockSsz blocks = 1;
}

// DataColumnSidecarsByRange-shaped.
// Cap: count ≤ 128 slots. Empty column_indices = all held indices.
message GetColumnsByRangeRequest {
  uint64 start_slot = 1;
  uint64 count = 2;
  repeated uint32 column_indices = 3;
}

// One (block_root, column indices) identifier (spec DataColumnsByRootIdentifier).
message ColumnsByRootIdentifier {
  bytes block_root = 1; // 32 B
  repeated uint32 column_indices = 2;
}

// DataColumnSidecarsByRoot-shaped. Cap 128 identifiers.
message GetColumnsByRootRequest {
  repeated ColumnsByRootIdentifier identifiers = 1;
}

// One column sidecar SSZ body.
message ColumnSsz {
  bytes ssz = 1;
  uint64 slot = 2;
  bytes root = 3; // 32 B
  uint32 index = 4;
}

message GetColumnsResponse {
  repeated ColumnSsz columns = 1;
}

// ---------------------------------------------------------------------------
// PutBackfillBatch (CC-4F /3) — blocks + columns + progress, one transaction
// ---------------------------------------------------------------------------

message BackfillBlock {
  uint64 slot = 1;
  bytes root = 2; // 32 B
  bytes ssz = 3;
}

message BackfillColumn {
  uint64 slot = 1;
  bytes root = 2; // 32 B
  uint32 index = 3;
  bytes ssz = 4;
}

// Mirrors crates/store meta::BackfillProgress field set (CC-47a).
message BackfillProgress {
  uint64 blocks_oldest = 1;
  bytes blocks_oldest_parent = 2; // 32 B
  uint64 columns_oldest = 3;
  // Per column-index oldest slot (NUMBER_OF_COLUMNS = 128); may be shorter.
  repeated uint64 per_index_oldest = 4;
}

message PutBackfillBatchRequest {
  repeated BackfillBlock blocks = 1;
  repeated BackfillColumn columns = 2;
  BackfillProgress progress = 3;
}

message PutBackfillBatchResponse {
  uint64 blocks_written = 1;
  uint64 columns_written = 2;
}

// ---------------------------------------------------------------------------
// WatchServeWindow (CC-4F /4) — server stream
// ---------------------------------------------------------------------------

message WatchServeWindowRequest {}

// Inclusive-exclusive hole range (§5.2).
message SlotRange {
  uint64 start = 1;
  uint64 end = 2;
}

// Persisted serve-window record (Architecture §1.6 / §2.5).
// earliest_available_slot + cgc live in ONE container (I3).
message ServeWindow {
  uint64 earliest_available_slot = 1;
  uint64 cgc = 2;
  uint64 head_slot = 3;
  uint64 block_floor = 4;
  uint64 column_floor = 5;
  uint32 branch = 6; // 1 | 2
  repeated SlotRange holes = 7;
}

// ---------------------------------------------------------------------------
// CC-4I historical surface — declared; implemented by CC-4I
// ---------------------------------------------------------------------------

// Block by root or by slot (oneof).
message GetHistoricalBlockRequest {
  oneof id {
    bytes root = 1; // 32 B
    uint64 slot = 2;
  }
}

message GetHistoricalBlockResponse {
  bytes ssz = 1;
  uint64 slot = 2;
  bytes root = 3; // 32 B
}

// Snapshot-ring state at `slot`. Outside the ring → typed NOT_AVAILABLE (CC-4I).
message GetSnapshotStateRequest {
  uint64 slot = 1;
}

// One chunk of a ~175 MB BeaconState SSZ stream.
message StateChunk {
  bytes data = 1;
  uint64 offset = 2;
  bool last = 3;
}

// ---------------------------------------------------------------------------
// CC-4I additive — finalized-checkpoint history
// ---------------------------------------------------------------------------

// Empty request: return every finalized checkpoint storage can name from
// meta ForkChoiceScalars and the snapshot ring (no replay).
message GetFinalizedCheckpointHistoryRequest {}

// Finalized checkpoint identity (epoch + root). Same field shape as
// eth.chain.v1.Checkpoint; kept local so storage does not import chain.
message FinalizedCheckpoint {
  uint64 epoch = 1;
  bytes root = 2; // 32 B
}

message GetFinalizedCheckpointHistoryResponse {
  // Ascending by epoch. Current FC finalized (when present) plus one entry
  // per snapshot-ring slot whose canonical root is known.
  repeated FinalizedCheckpoint checkpoints = 1;
}
