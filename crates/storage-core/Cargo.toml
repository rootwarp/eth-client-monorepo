[package]
name = "cc-storage-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["grpc"]
# Serve / boot host. Writer + ArchiveWrite stay proto-free (S2-A-14).
grpc = ["dep:cc-proto", "dep:tonic", "dep:cc-bootstrap", "dep:cc-node-key", "cc-seam/ipc"]

[dependencies]
# S2-B-03: production host. No JWT signer / HTTP client ([ARCH] §6.2 — not grandfathered).
# S2-A-05: ArchiveWrite impl over the live P0 mailbox.
anyhow = { workspace = true }
async-trait = { workspace = true }
cc-bootstrap = { workspace = true, optional = true }
cc-seam = { path = "../seam", default-features = false }
cc-config = { workspace = true }
cc-node-key = { workspace = true, optional = true }
cc-proto = { workspace = true, optional = true }
cc-state-transition = { workspace = true }
cc-store = { workspace = true }
cc-types = { workspace = true }
ethereum_ssz = { workspace = true }
futures = { workspace = true }
http-body = { workspace = true }
prometheus-client = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { workspace = true, optional = true }
tracing = { workspace = true }

[dev-dependencies]
alloy-primitives = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
prost = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
